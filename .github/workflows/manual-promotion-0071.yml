name: Manual Promotion Migration 0071

on:
  workflow_dispatch:
    inputs:
      target_schema:
        description: Schema to migrate (run staging first; Production requires a separate approval)
        required: true
        type: choice
        options:
          - idoc_staging
          - idoc_production
      confirmation:
        description: Type APPLY-0071-idoc_staging or APPLY-0071-idoc_production exactly
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: promotion-0071-maintenance
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref == 'refs/heads/staging' && ((inputs.target_schema == 'idoc_staging' && inputs.confirmation == 'APPLY-0071-idoc_staging') || (inputs.target_schema == 'idoc_production' && inputs.confirmation == 'APPLY-0071-idoc_production'))
    name: Apply 0071 to ${{ inputs.target_schema }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.target_schema == 'idoc_production' && 'idoc-db-production-maintenance' || 'idoc-db-staging-maintenance' }}
    steps:
      - name: Verify Production environment has non-bypassable review protection
        if: inputs.target_schema == 'idoc_production'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          configuration="$(gh api "repos/${GITHUB_REPOSITORY}/environments/idoc-db-production-maintenance")"
          if ! jq -e '.can_admins_bypass == false and (.protection_rules | any(.type == "required_reviewers" and (.reviewers | length > 0) and .prevent_self_review == true))' <<<"$configuration" >/dev/null; then
            echo "::error::Production environment must require reviewers and disable administrator bypass."
            exit 1
          fi
      - name: Check out protected staging code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install PostgreSQL 17 backup utilities
        run: |
          sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo "$VERSION_CODENAME")-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-17 awscli gnupg
      - name: Mandatory IDOC offsite pre-migration backup
        id: backup
        env:
          DATABASE_BACKUP_URL: ${{ secrets.IDOC_BACKUP_DATABASE_URL }}
          IDOC_BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.IDOC_BACKUP_ENCRYPTION_PASSPHRASE }}
          R2_ACCOUNT_ID: ${{ secrets.IDOC_R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.IDOC_R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.IDOC_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.IDOC_R2_SECRET_ACCESS_KEY }}
          BACKUP_KIND: pre-migration
          PROMOTION_TARGET_SCHEMA: ${{ inputs.target_schema }}
        run: bash scripts/backup-idoc-r2.sh
      - name: Apply schema-specific migration
        env:
          IDOC_MIGRATION_DATABASE_URL: ${{ secrets.IDOC_MIGRATION_DATABASE_URL }}
          PROMOTION_TARGET_SCHEMA: ${{ inputs.target_schema }}
          PROMOTION_CONFIRM: ${{ inputs.confirmation }}
          IDOC_BACKUP_VERIFIED: 'true'
          IDOC_BACKUP_SERVER_FINGERPRINT: ${{ steps.backup.outputs.server_fingerprint }}
        run: node scripts/apply-promotion-0071.mjs
