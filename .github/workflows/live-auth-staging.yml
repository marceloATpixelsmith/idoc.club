name: Live authentication staging suite

on:
  push:
    branches:
      - staging

concurrency:
  group: live-auth-staging
  cancel-in-progress: false

permissions:
  contents: read
  statuses: read

jobs:
  wait-for-staging-deployment:
    name: Wait for matching staging deployment
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      statuses: read
    steps:
      - name: Wait for Vercel to deploy the current staging commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const repository = process.env.GITHUB_REPOSITORY;
          const commitSha = process.env.GITHUB_SHA;
          const token = process.env.GH_TOKEN;
          const apiHeaders = {
            Accept: "application/vnd.github+json",
            Authorization: `Bearer ${token}`,
            "X-GitHub-Api-Version": "2022-11-28",
          };
          const deadline = Date.now() + 20 * 60 * 1000;

          async function getJson(path) {
            const response = await fetch(`https://api.github.com/repos/${repository}/${path}`, { headers: apiHeaders });
            if (!response.ok) {
              throw new Error(`GitHub API request failed (${response.status}) for ${path}.`);
            }
            return response.json();
          }

          while (Date.now() < deadline) {
            const branch = await getJson("branches/staging");
            if (branch.commit.sha !== commitSha) {
              throw new Error("Staging advanced to a different commit; refusing to test a stale deployment.");
            }

            const statuses = await getJson(`commits/${commitSha}/statuses?per_page=100`);
            const vercelStatus = statuses.find((status) => status.context === "Vercel");
            if (vercelStatus?.state === "success") {
              if (!vercelStatus.target_url?.startsWith("https://vercel.com/ayni-team/idoc.club/")) {
                throw new Error("The successful Vercel status does not point to the IDOC Vercel project.");
              }
              console.log(`Vercel reports commit ${commitSha} deployed successfully to the IDOC project.`);
              process.exit(0);
            }
            if (vercelStatus && ["failure", "error"].includes(vercelStatus.state)) {
              throw new Error(`Vercel deployment failed for ${commitSha} (${vercelStatus.state}).`);
            }

            console.log(`Waiting for Vercel deployment status for ${commitSha}.`);
            await new Promise((resolve) => setTimeout(resolve, 15000));
          }

          throw new Error(`Timed out waiting for Vercel deployment of ${commitSha}.`);
          NODE

  live-auth:
    name: Run live authentication suite
    needs: wait-for-staging-deployment
    environment: staging-live-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      LIVE_AUTH_BASE_URL: https://staging.idoc.club
      STAGING_POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      E2E_SERVICE_TOKEN: ${{ secrets.E2E_SERVICE_TOKEN }}
      E2E_SERVICE_URL: ${{ vars.E2E_SERVICE_URL }}
      LIVE_AUTH_TEST_PASSWORD: ${{ secrets.LIVE_AUTH_TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Validate required secrets and staging database boundary
        shell: bash
        run: |
          test -n "$STAGING_POSTGRES_URL"
          test -n "$E2E_SERVICE_TOKEN"
          test -n "$LIVE_AUTH_TEST_PASSWORD"
          node --conditions=react-server --import tsx --input-type=module -e "import { validateStagingDatabaseUrl } from './lib/db/staging-database-url.ts'; validateStagingDatabaseUrl(process.env.STAGING_POSTGRES_URL, true);"
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Create one disposable mailbox for the sequential auth journey
        id: mailbox
        run: |
          node --input-type=module -e "import { appendFileSync } from 'node:fs'; import { createMailbox } from './scripts/live-auth-mailbox.mjs'; const email = await createMailbox(); appendFileSync(process.env.GITHUB_OUTPUT, 'email=' + email + '\\n'); console.log('Created one disposable mailbox for this run.');"
      - name: Run live auth journey against staging
        id: live_tests
        env:
          LIVE_AUTH_EMAIL: ${{ steps.mailbox.outputs.email }}
        run: pnpm exec playwright test --config=playwright.live-auth.config.mjs
      - name: Build matrix result report
        if: always() && steps.mailbox.outputs.email != ''
        run: node scripts/write-live-auth-results.mjs
      - name: Clean up disposable staging account
        if: always() && steps.mailbox.outputs.email != ''
        env:
          LIVE_AUTH_EMAIL: ${{ steps.mailbox.outputs.email }}
        run: node --conditions=react-server --import tsx scripts/e2e-delete-test-account.ts --email="$LIVE_AUTH_EMAIL" --confirm-staging
      - name: Delete disposable mailbox
        if: always() && steps.mailbox.outputs.email != ''
        env:
          LIVE_AUTH_EMAIL: ${{ steps.mailbox.outputs.email }}
        run: node --input-type=module -e "import { deleteMailbox } from './scripts/live-auth-mailbox.mjs'; await deleteMailbox(process.env.LIVE_AUTH_EMAIL); console.log('Deleted the run mailbox.');"
      - name: Upload live auth results and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-auth-staging-results
          path: |
            test-results/auth/auth-live-results.json
            test-results/live-auth/
            playwright-report/
          if-no-files-found: warn
          retention-days: 30

