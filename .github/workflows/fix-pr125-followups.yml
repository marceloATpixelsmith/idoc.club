name: Fix PR 125 follow-ups
on:
  push:
    branches: [codex/complete-remaining-slice-2-controls]
    paths: [.github/workflows/fix-pr125-followups.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/complete-remaining-slice-2-controls
      - name: Apply focused fixes
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'missing expected text in {path}: {old[:120]!r}')
              p.write_text(s.replace(old, new))

          # Isolate the destructive recovery/replacement flow from shared administrator fixtures.
          replace('tests/security-e2e/global-setup.ts',
            "const STATES = ['member-a', 'member-b', 'onboarding', 'expired', 'suspended', 'administrator', 'super-administrator'] as const;",
            "const STATES = ['member-a', 'member-b', 'onboarding', 'expired', 'suspended', 'administrator', 'recovery-administrator', 'super-administrator'] as const;")
          replace('tests/security-e2e/global-setup.ts',
            "    if (name === 'administrator' || name === 'super-administrator') {\n      await sql`insert into idoc.application_roles(user_id,role,granted_by) values(${user.id},${name === 'administrator' ? 'administrator' : 'super_admin'},${user.id})`;",
            "    if (name === 'administrator' || name === 'recovery-administrator' || name === 'super-administrator') {\n      await sql`insert into idoc.application_roles(user_id,role,granted_by) values(${user.id},${name === 'super-administrator' ? 'super_admin' : 'administrator'},${user.id})`;")

          replace('tests/security-e2e/mfa-production-boundaries.spec.ts',
            "  const context = await browser.newContext({ storageState: '.security-e2e/administrator.json' });",
            "  const context = await browser.newContext({ storageState: '.security-e2e/recovery-administrator.json' });")
          replace('tests/security-e2e/mfa-production-boundaries.spec.ts',
            "  const [fixture] = await sql<{ id: number }[]>`select id from idoc.users where email='administrator@security.example.test'`;",
            "  const [fixture] = await sql<{ id: number }[]>`select id from idoc.users where email='recovery-administrator@security.example.test'`;")

          # Next injects its own route-announcer role=alert, so target the product error element specifically.
          p = Path('tests/security-e2e/mfa-production-boundaries.spec.ts')
          s = p.read_text().replace("await expect(page.getByRole('alert')).toContainText('incorrect');",
                                  "await expect(page.locator('.idoc-auth-error')).toContainText('incorrect');")
          s = s.replace("await expect(page.getByRole('alert')).toContainText('Too many attempts');",
                        "await expect(page.locator('.idoc-auth-error')).toContainText('Too many attempts');")
          p.write_text(s)

          # Keep authoritative backlog evidence internally consistent with the new live tests.
          p = Path('docs/23-auth-security-remediation-backlog.md')
          lines = p.read_text().splitlines()
          for i, line in enumerate(lines):
              if line.startswith('| AUTH-RECOVERY-005 |'):
                  cells = line.split('|')
                  cells[8] = ' `tests/security-e2e/mfa-production-boundaries.spec.ts` now behaviorally exercises the live recovery → replacement → acknowledgement path in Chromium with signed cookies and real Postgres; `tests/security-completeness-item-8.test.ts` provides structural coverage. '
                  cells[9] = ' The positive composed path is now proven behaviorally; expired/stale/cross-user/replay adversarial cases remain open, so the control is not yet fully verified. '
                  lines[i] = '|'.join(cells)
              elif line.startswith('| AUTH-RATE-006 |'):
                  cells = line.split('|')
                  cells[8] = ' `tests/security-e2e/mfa-production-boundaries.spec.ts` behaviorally drives the real fresh-step-up action and proves persisted `mfa_step_up_verify` rate-limit rows; `tests/rate-limit-normalization.integration.ts` separately proves the generic dual-bucket primitive. '
                  cells[9] = ' Live step-up purpose wiring is now proven, but login, recovery-code, and enrollment-confirm purpose wiring plus cross-purpose/concurrency coverage remain open. '
                  lines[i] = '|'.join(cells)
          p.write_text('\n'.join(lines) + '\n')
      - name: Commit fixes and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/fix-pr125-followups.yml
          git config user.name "Pixelsmith"
          git config user.email "144948098+marceloATpixelsmith@users.noreply.github.com"
          git add -A
          git commit -m "Fix PR 125 review findings and e2e selectors"
          git push origin HEAD:codex/complete-remaining-slice-2-controls
