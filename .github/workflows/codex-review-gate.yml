name: Codex Review Gate

on:
  pull_request_target:
    types: [opened, ready_for_review, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read
  issues: write
  statuses: write

jobs:
  wait-for-codex:
    name: Codex review progress
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      MAX_WAIT_SECONDS: "1800"
      POLL_SECONDS: "15"
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Mark this revision as awaiting Codex
        run: |
          set -euo pipefail
          PR_URL="${GITHUB_SERVER_URL}/${REPOSITORY}/pull/${PR_NUMBER}"
          jq -n \
            --arg state "pending" \
            --arg context "codex/review-complete" \
            --arg description "Codex review in progress" \
            --arg target_url "${PR_URL}" \
            '{state: $state, context: $context, description: $description, target_url: $target_url}' > status.json
          curl --fail-with-body --silent --show-error --connect-timeout 5 --max-time 15 --retry 4 --retry-all-errors --retry-delay 2 --retry-max-time 20 \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${REPOSITORY}/statuses/${HEAD_SHA}" \
            --data-binary @status.json

      - name: Ask Codex to review this exact revision
        run: |
          set -euo pipefail
          # The chatgpt-codex-connector app does not reliably auto-review every synchronize push in
          # this repository; without an explicit nudge, the wait step below can sit idle for the
          # full 30-minute deadline before failing, on every single push. Ask directly instead of
          # waiting on that assumption -- harmless to repeat once per revision if Codex did already
          # pick the push up on its own.
          jq -n --arg body "@codex review" '{body: $body}' > review-request.json
          curl --fail-with-body --silent --show-error --connect-timeout 5 --max-time 15 --retry 4 --retry-all-errors --retry-delay 2 --retry-max-time 20 \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --data-binary @review-request.json

      - name: Wait visibly for Codex to finish this exact revision
        run: |
          set -euo pipefail

          post_status() {
            local state="$1"
            local description="$2"
            local target_url="$3"
            jq -n \
              --arg state "${state}" \
              --arg context "codex/review-complete" \
              --arg description "${description}" \
              --arg target_url "${target_url}" \
              '{state: $state, context: $context, description: $description, target_url: $target_url}' > status-update.json
            curl --fail-with-body --silent --show-error --connect-timeout 5 --max-time 15 --retry 4 --retry-all-errors --retry-delay 2 --retry-max-time 20 \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL}/repos/${REPOSITORY}/statuses/${HEAD_SHA}" \
              --data-binary @status-update.json
          }

          finalize_error() {
            local exit_code=$?
            trap - ERR
            set +e
            local pr_url="${GITHUB_SERVER_URL}/${REPOSITORY}/pull/${PR_NUMBER}"
            post_status "failure" "Codex gate error; see Actions log" "${pr_url}" || true
            echo "::error::Codex review gate aborted unexpectedly; codex/review-complete was finalized as failure."
            exit "${exit_code}"
          }
          trap finalize_error ERR
          deadline=$(( $(date +%s) + MAX_WAIT_SECONDS ))

          api_get() {
            curl --fail-with-body --silent --show-error --connect-timeout 5 --max-time 15 --retry 4 --retry-all-errors --retry-delay 2 --retry-max-time 20 \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$1"
          }

          codex_review_url() {
            local page=1
            local reviews
            local count
            local match

            while true
            do
              if (( $(date +%s) >= deadline ))
              then
                return 124
              fi
              if ! reviews="$(api_get "${GITHUB_API_URL}/repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100&page=${page}")"
              then
                return 1
              fi
              match="$(jq -r --arg head "${HEAD_SHA}" '
                [.[] |
                  select(
                    .user.login == "chatgpt-codex-connector" or
                    .user.login == "chatgpt-codex-connector[bot]"
                  ) |
                  select(.commit_id == $head)
                ] |
                last |
                .html_url // empty
              ' <<< "${reviews}")"
              if [[ -n "${match}" ]]
              then
                echo "${match}"
                return 0
              fi

              count="$(jq 'length' <<< "${reviews}")"
              if (( count < 100 ))
              then
                return 0
              fi
              page=$((page + 1))
            done
          }

          codex_no_issues_comment_url() {
            local page=1
            local comments
            local count
            local match

            while true
            do
              if (( $(date +%s) >= deadline ))
              then
                return 124
              fi
              if ! comments="$(api_get "${GITHUB_API_URL}/repos/${REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100&page=${page}")"
              then
                return 1
              fi
              match="$(jq -r --arg head "${HEAD_SHA}" '
                [.[] |
                  select(
                    .user.login == "chatgpt-codex-connector" or
                    .user.login == "chatgpt-codex-connector[bot]"
                  ) |
                  select((.body | contains("Codex Review: Didn")) and (.body | contains("find any major issues"))) |
                  . + {
                    reviewed_sha: (
                      try (
                        .body |
                        capture("Reviewed commit:\\*\\*[^0-9a-fA-F]*(?<sha>[0-9a-fA-F]{10,40})").sha
                      ) catch ""
                    )
                  } |
                  select((.reviewed_sha | length) >= 10) |
                  select(
                    . as $comment |
                    ($head | ascii_downcase | startswith($comment.reviewed_sha | ascii_downcase))
                  )
                ] |
                last |
                .html_url // empty
              ' <<< "${comments}")"
              if [[ -n "${match}" ]]
              then
                echo "${match}"
                return 0
              fi

              count="$(jq 'length' <<< "${comments}")"
              if (( count < 100 ))
              then
                return 0
              fi
              page=$((page + 1))
            done
          }

          # A repository administrator may run the separate quota-waiver workflow while this job is
          # still polling; it posts its own "success" status for this same context and revision,
          # bypassing the review/comment detectors above entirely. The Statuses API has no
          # compare-and-swap primitive, so a read-then-write check can never fully close the race
          # against a concurrently in-flight waiver request -- but checking every loop iteration
          # (instead of only once, right before the timeout failure) shrinks that window from up to
          # thirty minutes down to at most one poll interval, which is the practical mitigation this
          # gate can offer without redesigning the two workflows to coordinate directly.
          # Called directly as an `if` condition at both call sites below -- bash suppresses
          # errexit/ERR-trap handling for the whole compound command in that position, so an
          # unguarded failed assignment inside this function would silently read as an empty
          # $state (i.e. "no waiver") instead of "we couldn't tell". That matters here specifically:
          # misreading a transient lookup failure as "no waiver" on the final check is exactly the
          # kind of false negative that could overwrite a real, already-posted waiver with failure --
          # the same race this function exists to close. Handle the failure explicitly, same as
          # codex_review_url()/codex_no_issues_comment_url() do for their own api_get calls, and
          # retry a couple of times before giving up, since api_get's own 4 retries can still both
          # legitimately fail under sustained but short-lived flakiness.
          quota_waiver_already_succeeded() {
            local response
            local state
            local attempt

            for attempt in 1 2 3
            do
              if response="$(api_get "${GITHUB_API_URL}/repos/${REPOSITORY}/commits/${HEAD_SHA}/status")"
              then
                state="$(jq -r '.statuses[]? | select(.context == "codex/review-complete") | .state' <<< "${response}")"
                [[ "${state}" == "success" ]]
                return
              fi
              echo "::warning::Could not check for an existing quota waiver on attempt ${attempt}/3." >&2
              sleep 2
            done

            echo "::warning::Could not confirm whether a quota waiver already succeeded for ${HEAD_SHA} after 3 attempts; treating as none found." >&2
            return 1
          }

          while (( $(date +%s) < deadline ))
          do
            REVIEW_URL="$(codex_review_url)"
            if [[ -z "${REVIEW_URL}" ]]
            then
              REVIEW_URL="$(codex_no_issues_comment_url)"
            fi

            if [[ -n "${REVIEW_URL}" ]]
            then
              post_status "success" "Codex finished reviewing this revision" "${REVIEW_URL}"
              trap - ERR
              echo "### Codex review complete" >> "${GITHUB_STEP_SUMMARY}"
              echo "Codex reviewed the current head ${HEAD_SHA}." >> "${GITHUB_STEP_SUMMARY}"
              exit 0
            fi

            if quota_waiver_already_succeeded
            then
              trap - ERR
              echo "### codex/review-complete already satisfied" >> "${GITHUB_STEP_SUMMARY}"
              echo "A success status for ${HEAD_SHA} was already posted (e.g. by the quota-waiver workflow); not overwriting it." >> "${GITHUB_STEP_SUMMARY}"
              exit 0
            fi

            remaining=$((deadline - $(date +%s)))
            echo "Codex has not yet reported a review for ${HEAD_SHA}; ${remaining}s remain before failure."
            if (( remaining > POLL_SECONDS ))
            then
              sleep "${POLL_SECONDS}"
            elif (( remaining > 0 ))
            then
              sleep "${remaining}"
            fi
          done

          # Final check, immediately before declaring failure, to close as much of the remaining
          # window as possible -- the ERR trap stays active through this lookup too, so a transient
          # API failure here still finalizes the required status instead of leaving it stranded.
          if quota_waiver_already_succeeded
          then
            trap - ERR
            echo "### codex/review-complete already satisfied" >> "${GITHUB_STEP_SUMMARY}"
            echo "A success status for ${HEAD_SHA} was already posted (e.g. by the quota-waiver workflow); not overwriting it." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          trap - ERR
          PR_URL="${GITHUB_SERVER_URL}/${REPOSITORY}/pull/${PR_NUMBER}"
          if ! post_status "failure" "Codex review not detected within 30 minutes" "${PR_URL}"
          then
            echo "::error::Timed out waiting for Codex and could not publish the failure status."
          fi
          echo "::error::Codex review was not detected within 30 minutes. Re-trigger Codex review and re-run this check."
          exit 1
