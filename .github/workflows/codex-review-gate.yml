name: Codex Review Gate

on:
  pull_request_review:
    types: [submitted]
  pull_request_target:
    types: [opened, ready_for_review, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  mark-pending:
    if: github.event_name == 'pull_request_target'
    name: Wait for Codex review
    runs-on: ubuntu-latest
    steps:
      - name: Mark the current revision as awaiting Codex
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          jq -n \
            --arg state "pending" \
            --arg context "codex/review-complete" \
            --arg description "Waiting for Codex to review this revision" \
            --arg target_url "${GITHUB_SERVER_URL}/${REPOSITORY}/pull/${PR_NUMBER}" \
            '{state: $state, context: $context, description: $description, target_url: $target_url}' > status.json
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${REPOSITORY}/statuses/${HEAD_SHA}" \
            --data-binary @status.json

  mark-complete:
    if: >-
      github.event_name == 'pull_request_review' &&
      (github.event.review.user.login == 'chatgpt-codex-connector' ||
      github.event.review.user.login == 'chatgpt-codex-connector[bot]')
    name: Accept completed Codex review
    runs-on: ubuntu-latest
    steps:
      - name: Verify the reviewed revision and pass the gate
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
          REVIEWED_SHA: ${{ github.event.review.commit_id }}
          REVIEW_URL: ${{ github.event.review.html_url }}
        run: |
          set -euo pipefail
          if [[ -z "${REVIEWED_SHA}" || "${REVIEWED_SHA}" != "${HEAD_SHA}" ]]
          then
              echo "The Codex review is for an older PR revision; the current revision remains pending."
              exit 0
          fi
          jq -n \
            --arg state "success" \
            --arg context "codex/review-complete" \
            --arg description "Codex finished reviewing this revision" \
            --arg target_url "${REVIEW_URL}" \
            '{state: $state, context: $context, description: $description, target_url: $target_url}' > status.json
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${REPOSITORY}/statuses/${HEAD_SHA}" \
            --data-binary @status.json
