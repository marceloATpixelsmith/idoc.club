name: Codex Review Gate

on:
  pull_request_target:
    types: [opened, ready_for_review, reopened, synchronize]
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: read
  statuses: write

concurrency:
  group: codex-review-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  review-status:
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request != null
    name: Codex review progress
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
      REPOSITORY: ${{ github.repository }}
      EVENT_NAME: ${{ github.event_name }}
      EVENT_ACTION: ${{ github.event.action }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.review.commit_id }}
      ACTOR_LOGIN: ${{ github.event.comment.user.login || github.event.review.user.login }}
      COMMENT_BODY: ${{ github.event.comment.body }}
      IS_PULL_REQUEST: ${{ github.event.issue.pull_request != null }}
    steps:
      - name: Set this revision pending and request review
        if: github.event_name == 'pull_request_target'
        run: |
          set -euo pipefail
          PR_URL="${GITHUB_SERVER_URL}/${REPOSITORY}/pull/${PR_NUMBER}"
          jq -n --arg body "@codex review" '{body:$body}' > review-request.json
          curl --fail-with-body --silent --show-error --connect-timeout 5 --max-time 15 --retry 3 --retry-all-errors --retry-delay 2 \
            --request POST --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" --data-binary @review-request.json
          # Publish the advisory success only after GitHub accepted the Codex review request.
          jq -n --arg state success --arg context "codex/review-complete" --arg description "Codex review requested (advisory); CI gates are authoritative" --arg target_url "${PR_URL}" '{state:$state,context:$context,description:$description,target_url:$target_url}' > status.json
          curl --fail-with-body --silent --show-error --connect-timeout 5 --max-time 15 --retry 3 --retry-all-errors --retry-delay 2 \
            --request POST --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${REPOSITORY}/statuses/${HEAD_SHA}" --data-binary @status.json
          echo "Review requested for ${HEAD_SHA}; this runner exits without polling."

      - name: Complete status when Codex reviews the current revision
        if: github.event_name != 'pull_request_target'
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "issue_comment" && "${IS_PULL_REQUEST}" != "true" ]]; then
            echo "Comment is not attached to a pull request; no action required."
            exit 0
          fi
          if [[ "${ACTOR_LOGIN}" != "chatgpt-codex-connector" && "${ACTOR_LOGIN}" != "chatgpt-codex-connector[bot]" ]]; then
            echo "Event is not from the Codex review connector; no action required."
            exit 0
          fi
          CURRENT_SHA="$(curl --fail-with-body --silent --show-error --connect-timeout 5 --max-time 15 \
            --header "Accept: application/vnd.github+json" --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${REPOSITORY}/pulls/${PR_NUMBER}" | jq -r '.head.sha')"
          REVIEWED_SHA=""
          REVIEW_URL="${GITHUB_SERVER_URL}/${REPOSITORY}/pull/${PR_NUMBER}"
          if [[ "${EVENT_NAME}" == "pull_request_review" ]]; then
            REVIEWED_SHA="${HEAD_SHA}"
            REVIEW_URL="${GITHUB_SERVER_URL}/${REPOSITORY}/pull/${PR_NUMBER}"
          elif [[ "${EVENT_NAME}" == "issue_comment" ]]; then
            REVIEWED_SHA="$(printf '%s' "${COMMENT_BODY}" | sed -nE 's/.*Reviewed commit:\*\*[^0-9a-fA-F]*([0-9a-fA-F]{10,40}).*/\1/p' | tail -n 1)"
          fi
          if [[ -z "${REVIEWED_SHA}" || "${CURRENT_SHA,,}" != "${REVIEWED_SHA,,}" && ! "${CURRENT_SHA,,}" == "${REVIEWED_SHA,,}"* ]]; then
            echo "No Codex review for the current PR revision was found; status remains pending."
            exit 0
          fi
          if [[ "${EVENT_NAME}" == "issue_comment" ]] && { ! grep -Fq "Codex Review: Didn" <<< "${COMMENT_BODY}" || ! grep -Fq "find any major issues" <<< "${COMMENT_BODY}"; }; then
            echo "Codex comment does not match the no-issues completion format; status remains pending."
            exit 0
          fi
          jq -n --arg state success --arg context "codex/review-complete" --arg description "Codex review received (advisory); CI gates are authoritative" --arg target_url "${REVIEW_URL}" '{state:$state,context:$context,description:$description,target_url:$target_url}' > status.json
          curl --fail-with-body --silent --show-error --connect-timeout 5 --max-time 15 --retry 3 --retry-all-errors --retry-delay 2 \
            --request POST --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${REPOSITORY}/statuses/${CURRENT_SHA}" --data-binary @status.json
          echo "Codex review completed for ${CURRENT_SHA}."
