name: Codex Review Gate

on:
  # One-time same-repository bootstrap for PR #282, which repairs the broken base-branch gate.
  # Remove pull_request after #282 lands; the permanent gate runs from pull_request_target.
  pull_request:
    branches: [staging]
    types: [opened, ready_for_review, reopened, synchronize]
  pull_request_target:
    types: [opened, ready_for_review, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  wait-for-codex:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.number == 282 &&
       github.event.pull_request.head.repo.full_name == github.repository)
    name: Codex review progress
    runs-on: ubuntu-latest
    timeout-minutes: 32
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      MAX_WAIT_SECONDS: "1800"
      POLL_SECONDS: "15"
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Mark this revision as awaiting Codex
        run: |
          set -euo pipefail
          PR_URL="${GITHUB_SERVER_URL}/${REPOSITORY}/pull/${PR_NUMBER}"
          jq -n \
            --arg state "pending" \
            --arg context "codex/review-complete" \
            --arg description "Codex review in progress" \
            --arg target_url "${PR_URL}" \
            '{state: $state, context: $context, description: $description, target_url: $target_url}' > status.json
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${REPOSITORY}/statuses/${HEAD_SHA}" \
            --data-binary @status.json

      - name: Wait visibly for Codex to finish this exact revision
        run: |
          set -euo pipefail

          codex_review_url() {
            local reviews
            reviews="$(
              curl --fail-with-body --silent --show-error \
                --header "Accept: application/vnd.github+json" \
                --header "Authorization: Bearer ${GH_TOKEN}" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                "${GITHUB_API_URL}/repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100"
            )"

            jq -r --arg head "${HEAD_SHA}" '
              [.[] |
                select(
                  .user.login == "chatgpt-codex-connector" or
                  .user.login == "chatgpt-codex-connector[bot]"
                ) |
                select(.commit_id == $head)
              ] |
              last |
              .html_url // empty
            ' <<< "${reviews}"
          }

          codex_no_issues_comment_url() {
            local comments
            comments="$(
              curl --fail-with-body --silent --show-error \
                --header "Accept: application/vnd.github+json" \
                --header "Authorization: Bearer ${GH_TOKEN}" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                "${GITHUB_API_URL}/repos/${REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100"
            )"

            jq -r --arg head "${HEAD_SHA}" '
              [.[] |
                select(
                  .user.login == "chatgpt-codex-connector" or
                  .user.login == "chatgpt-codex-connector[bot]"
                ) |
                select((.body | contains("Codex Review: Didn")) and (.body | contains("find any major issues"))) |
                . + {
                  reviewed_sha: (
                    try (
                      .body |
                      capture("Reviewed commit:\\*\\*[^0-9a-fA-F]*(?<sha>[0-9a-fA-F]{10,40})").sha
                    ) catch ""
                  )
                } |
                select((.reviewed_sha | length) >= 10) |
                select(
                  . as $comment |
                  ($head | ascii_downcase | startswith($comment.reviewed_sha | ascii_downcase))
                )
              ] |
              last |
              .html_url // empty
            ' <<< "${comments}"
          }

          elapsed=0
          while (( elapsed <= MAX_WAIT_SECONDS ))
          do
            REVIEW_URL="$(codex_review_url)"
            if [[ -z "${REVIEW_URL}" ]]
            then
              REVIEW_URL="$(codex_no_issues_comment_url)"
            fi

            if [[ -n "${REVIEW_URL}" ]]
            then
              jq -n \
                --arg state "success" \
                --arg context "codex/review-complete" \
                --arg description "Codex finished reviewing this revision" \
                --arg target_url "${REVIEW_URL}" \
                '{state: $state, context: $context, description: $description, target_url: $target_url}' > success.json
              curl --fail-with-body --silent --show-error \
                --request POST \
                --header "Accept: application/vnd.github+json" \
                --header "Authorization: Bearer ${GH_TOKEN}" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                "${GITHUB_API_URL}/repos/${REPOSITORY}/statuses/${HEAD_SHA}" \
                --data-binary @success.json
              echo "### Codex review complete" >> "${GITHUB_STEP_SUMMARY}"
              echo "Codex reviewed the current head ${HEAD_SHA}." >> "${GITHUB_STEP_SUMMARY}"
              exit 0
            fi

            echo "Codex has not yet reported a review for ${HEAD_SHA}; checked after ${elapsed}s."
            sleep "${POLL_SECONDS}"
            elapsed=$((elapsed + POLL_SECONDS))
          done

          PR_URL="${GITHUB_SERVER_URL}/${REPOSITORY}/pull/${PR_NUMBER}"
          jq -n \
            --arg state "failure" \
            --arg context "codex/review-complete" \
            --arg description "Codex review not detected within 30 minutes" \
            --arg target_url "${PR_URL}" \
            '{state: $state, context: $context, description: $description, target_url: $target_url}' > timeout.json
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${REPOSITORY}/statuses/${HEAD_SHA}" \
            --data-binary @timeout.json
          echo "::error::Codex review was not detected within 30 minutes. Re-trigger Codex review and re-run this check."
          exit 1
