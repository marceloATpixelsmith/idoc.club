name: Auto-migrate Production Schema

# Applies committed Drizzle migrations to idoc_production whenever migration files change on main (that is,
# when a staging-to-main promotion carries a migration), so the Production database cannot fall behind the
# deployed code. The job is held by the idoc-db-production-maintenance environment: it needs reviewer
# approval, takes a verified offsite backup first, refuses unless idoc_staging is already at the newest
# committed migration, and verifies the ledger afterwards. This file itself is deliberately NOT in the
# trigger paths, so adding or editing it never migrates Production.
on:
  push:
    branches:
      - main
    paths:
      - lib/db/migrations/**
      - scripts/migrate-selected-schema.ts
      - scripts/schema-migration-sql.mjs
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: pending-migrations-maintenance
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref == 'refs/heads/main'
    name: Apply pending migrations to idoc_production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: idoc-db-production-maintenance
    steps:
      - name: Verify the Production environment has non-bypassable review protection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          configuration="$(gh api "repos/${GITHUB_REPOSITORY}/environments/idoc-db-production-maintenance")"
          if ! jq -e '.can_admins_bypass == false and (.protection_rules | any(.type == "required_reviewers" and (.reviewers | length > 0) and .prevent_self_review == true))' <<<"$configuration" >/dev/null; then
            echo "::error::Production environment must require reviewers and disable administrator bypass."
            exit 1
          fi
      - name: Check out main
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install PostgreSQL 17 backup utilities
        run: |
          sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --batch --yes --dearmor -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo "$VERSION_CODENAME")-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-17 gnupg
          aws --version
      - name: Mandatory IDOC offsite pre-migration backup
        id: backup
        env:
          DATABASE_BACKUP_URL: ${{ secrets.IDOC_BACKUP_DATABASE_URL }}
          IDOC_BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.IDOC_BACKUP_ENCRYPTION_PASSPHRASE }}
          R2_ACCOUNT_ID: ${{ secrets.IDOC_R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.IDOC_R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.IDOC_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.IDOC_R2_SECRET_ACCESS_KEY }}
          BACKUP_KIND: pre-migration
          PROMOTION_TARGET_SCHEMA: idoc_production
        run: bash scripts/backup-idoc-r2.sh
      - name: Guard - bind to the backed-up server, require the ledger at 0070 or later, and require staging at the newest migration
        env:
          IDOC_MIGRATION_DATABASE_URL: ${{ secrets.IDOC_MIGRATION_DATABASE_URL }}
          TARGET_SCHEMA: idoc_production
          IDOC_BACKUP_SERVER_FINGERPRINT: ${{ steps.backup.outputs.server_fingerprint }}
        run: node scripts/guard-pending-migrations.mjs before
      - name: Apply every pending committed migration to idoc_production
        env:
          POSTGRES_URL: ${{ secrets.IDOC_MIGRATION_DATABASE_URL }}
          DB_SCHEMA: idoc_production
        run: pnpm db:migrate
      - name: Verify the ledger reached the newest committed migration
        env:
          IDOC_MIGRATION_DATABASE_URL: ${{ secrets.IDOC_MIGRATION_DATABASE_URL }}
          TARGET_SCHEMA: idoc_production
        run: node scripts/guard-pending-migrations.mjs after
