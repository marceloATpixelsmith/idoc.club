name: IDOC R2 Schema Backups

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: idoc-r2-daily-backup
  cancel-in-progress: false

jobs:
  backup:
    if: github.ref == 'refs/heads/main'
    name: Back up IDOC schemas to R2
    runs-on: ubuntu-latest
    environment: idoc-db-backups
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --batch --yes --dearmor -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo "$VERSION_CODENAME")-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          # The restore check starts its own throwaway cluster, so do not let the package create and start a system one.
          sudo sed -i 's/^#\?create_main_cluster = .*/create_main_cluster = false/' /etc/postgresql-common/createcluster.conf || true
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-17 postgresql-client-17 gnupg
          aws --version
      - name: Create and verify offsite backups
        env:
          DATABASE_BACKUP_URL: ${{ secrets.IDOC_BACKUP_DATABASE_URL }}
          IDOC_BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.IDOC_BACKUP_ENCRYPTION_PASSPHRASE }}
          R2_ACCOUNT_ID: ${{ secrets.IDOC_R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.IDOC_R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.IDOC_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.IDOC_R2_SECRET_ACCESS_KEY }}
          BACKUP_KIND: daily
          IDOC_RESTORE_CHECK: 'true'
          RESTORE_CHECK_INPUT_DIR: ${{ runner.temp }}/idoc-restore-input
        run: bash scripts/backup-idoc-r2.sh
      # Deliberately no env: here and no secrets: this step executes SQL taken from the archive (pg_restore), so it must not be able to read credentials.
      - name: Restore check (runs with no credentials)
        run: bash scripts/restore-check-idoc.sh "${{ runner.temp }}/idoc-restore-input"
      - name: Remove restore input
        if: always()
        run: rm -rf "${{ runner.temp }}/idoc-restore-input"

  # Alert that does not depend on anyone's personal Actions notification setting: GitHub emails only whoever last edited the cron line, and a
  # failing nightly run went unnoticed for days. An open issue notifies everyone watching the repository. No environment and no secrets.
  notify-failure:
    if: github.ref == 'refs/heads/main' && failure()
    name: Open an issue when the nightly backup fails
    needs: backup
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='IDOC nightly backup is failing'
          body="The IDOC R2 Schema Backups run failed: $RUN_URL. Open the run, fix the cause, then re-run the workflow from the Actions tab. Close this issue once a run passes."
          existing="$(gh issue list --state open --search "\"$title\" in:title" --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")"
          if [[ -n "$existing" ]]; then gh issue comment "$existing" --body "Failed again: $RUN_URL"; else gh issue create --title "$title" --body "$body"; fi
