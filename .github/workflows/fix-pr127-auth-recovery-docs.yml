name: Fix PR127 auth recovery evidence
on:
  push:
    branches: [codex/close-auth-recovery-005-tests]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/close-auth-recovery-005-tests
      - name: Align AUTH-RECOVERY-005 evidence docs
        run: |
          python - <<'PY'
          from pathlib import Path
          p22=Path('docs/22-canonical-auth-evidence-matrix.md')
          s=p22.read_text()
          s=s.replace('| verified | 116 | 74.8% |','| verified | 117 | 75.5% |')
          s=s.replace('| implemented-but-unverified | 18 | 11.6% |','| implemented-but-unverified | 17 | 11.0% |')
          lines=[]
          found=False
          for line in s.splitlines():
              if line.startswith('| AUTH-RECOVERY-005 |'):
                  found=True
                  parts=line.split('|')
                  parts[4] = ' Signed pending cookie plus canonical MFA/session tables '
                  parts[5] = ' `tests/security-e2e/mfa-production-boundaries.spec.ts` proves the positive composed browser flow; `tests/auth-recovery-adversarial.integration.ts` drives the real production recovery Server Actions with signed continuations and real Postgres across expired recovery-entry/replacement/ack authority, stale sessionVersion at every stage, cross-user surrounding-session substitution, replay of prior-stage cookies, pre-replacement acknowledgement denial, and persisted no-duplicate/no-session assertions. '
                  parts[6] = ' verified '
                  parts[7] = ' The full composed recovery state machine is behaviorally covered through the production actions for positive, expiry, stale-authority, cross-user, and action-level replay cases. Acknowledgement remains atomic, owner/factor/transaction-bound, single-use, and backed by the refreshed database acknowledgement window. '
                  line='|'.join(parts)
              lines.append(line)
          assert found
          p22.write_text('\n'.join(lines)+'\n')

          p23=Path('docs/23-auth-security-remediation-backlog.md')
          s=p23.read_text()
          s=s.replace('**116 verified, 18 implemented-but-unverified, 14 partial, 0 missing, and 7\nnot-applicable**. Consequently, the table below has exactly **32 applicable non-verified controls**.',
                      '**117 verified, 17 implemented-but-unverified, 14 partial, 0 missing, and 7\nnot-applicable**. Consequently, the table below has exactly **31 applicable non-verified controls**.')
          s='\n'.join(line for line in s.splitlines() if not line.startswith('| AUTH-RECOVERY-005 |'))+'\n'
          # Remove stale Slice 2 mentions without disturbing other controls.
          s=s.replace('AUTH-RECOVERY-005, ', '').replace(', AUTH-RECOVERY-005', '').replace('AUTH-RECOVERY-005', '')
          p23.write_text(s)
          PY
          node scripts/validate-auth-docs.mjs
      - name: Commit evidence alignment and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-pr127-auth-recovery-docs.yml
          git add docs/22-canonical-auth-evidence-matrix.md docs/23-auth-security-remediation-backlog.md
          git commit -m "Align AUTH-RECOVERY-005 evidence records"
          git push origin HEAD:codex/close-auth-recovery-005-tests
