name: Fix PR128 typecheck
on:
  push:
    branches: [gpt/finish-auth-slice-2]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/finish-auth-slice-2
      - name: Patch test typing
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/slice2-auth-boundaries.integration.ts')
          s = p.read_text()
          s = s.replace("import { generateRecoveryCodes } from '../app/(dashboard)/dashboard/security/actions.ts';", "import { regenerateRecoveryCodes } from '../app/(dashboard)/dashboard/security/actions.ts';")
          s = s.replace('generateRecoveryCodes(', 'regenerateRecoveryCodes(')
          s = s.replace('  } as never;\n}', '  } as any;\n}')
          s = s.replace('cookies: TestCookies, user: never, secret:', 'cookies: TestCookies, user: any, secret:')
          s = s.replace("const productionEnvironment = { ...process.env, NODE_ENV: 'production' };", "const productionEnvironment = { ...process.env, NODE_ENV: 'production' as const };")
          p.write_text(s)
          PY
          rm .github/workflows/fix-pr128-typecheck.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/slice2-auth-boundaries.integration.ts .github/workflows/fix-pr128-typecheck.yml
          git commit -m 'Fix Slice 2 integration test typing'
          git push origin HEAD:gpt/finish-auth-slice-2
