name: New Relic IDOC deployment tracking

on:
  deployment_status:

permissions:
  contents: read

jobs:
  record-deployment:
    # Record finished Vercel deployments: success, and failure/error so a failed
    # build is visible in New Relic Change Tracking. GitHub deployment events are
    # emitted by Vercel; a git push is not evidence of a successful deployment.
    # Vercel sends a commit SHA in deployment.ref, not a branch name.
    # The branch-head check below excludes unrelated Preview deployments.
    if: >-
      (github.event.deployment_status.state == 'success' ||
       github.event.deployment_status.state == 'failure' ||
       github.event.deployment_status.state == 'error') &&
      (github.event.deployment.environment == 'Production' ||
       github.event.deployment.environment == 'Preview') &&
      github.event.deployment.creator.login == 'vercel[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed SHA is the environment branch head
        id: verify
        uses: actions/github-script@v7
        with:
          script: |
            const environment = context.payload.deployment.environment;
            const branch = environment === 'Production' ? 'main' : 'staging';
            const { data } = await github.rest.repos.getBranch({ ...context.repo, branch });
            const matches = data.commit.sha === context.payload.deployment.sha;
            core.info(`Deployment environment=${environment}, expected branch=${branch}, matches current head=${matches}`);
            core.setOutput('eligible', String(matches));
      - name: Record IDOC change in New Relic
        if: steps.verify.outputs.eligible == 'true' && github.event.deployment_status.state == 'success'
        uses: newrelic/deployment-marker-action@v2.6.2
        with:
          commandType: changeTrackingCreateEvent
          apiKey: ${{ secrets.NEW_RELIC_API_KEY }}
          region: US
          category: Deployment
          type: Basic
          entitySearch: "name = 'idoc.club' AND type = 'SERVICE' AND accountId = '8600002'"
          version: ${{ github.event.deployment.sha }}
          commit: ${{ github.event.deployment.sha }}
          deeplink: ${{ github.event.deployment_status.target_url }}
          user: ${{ github.actor }}
          shortDescription: IDOC Vercel deployment
          description: "Successful IDOC Vercel deployment (${{ github.event.deployment.environment }})"
          customAttributes: '{application: "idoc.club", deploymentState: "success", vercelProjectId: "prj_OQ45skGMvZt6XB0ieDfsyqyp7Sb4", githubRepository: "marceloATpixelsmith/idoc.club"}'
      - name: Record failed IDOC deployment in New Relic
        if: steps.verify.outputs.eligible == 'true' && github.event.deployment_status.state != 'success'
        uses: newrelic/deployment-marker-action@v2.6.2
        with:
          commandType: changeTrackingCreateEvent
          apiKey: ${{ secrets.NEW_RELIC_API_KEY }}
          region: US
          category: Deployment
          type: Basic
          entitySearch: "name = 'idoc.club' AND type = 'SERVICE' AND accountId = '8600002'"
          version: ${{ github.event.deployment.sha }}
          commit: ${{ github.event.deployment.sha }}
          deeplink: ${{ github.event.deployment_status.target_url }}
          user: ${{ github.actor }}
          shortDescription: IDOC Vercel deployment FAILED
          description: "FAILED IDOC Vercel deployment (${{ github.event.deployment.environment }}, state ${{ github.event.deployment_status.state }}); the previous successful deployment remains live"
          customAttributes: '{application: "idoc.club", deploymentState: "failed", vercelProjectId: "prj_OQ45skGMvZt6XB0ieDfsyqyp7Sb4", githubRepository: "marceloATpixelsmith/idoc.club"}'
