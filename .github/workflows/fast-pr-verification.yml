name: Fast PR verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_sha:
        description: Base commit to compare for manual classification
        required: false
        default: origin/main

permissions:
  contents: read

jobs:
  verify:
    name: Fast PR checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.1 }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Classify CI risk
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha || github.event.before || 'origin/main' }}
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/classify-ci-risk.mjs
      - run: node scripts/validate-auth-docs.mjs
      - run: node scripts/validate-release-checklist.mjs
      - run: node scripts/check-whitespace.mjs
      - run: pnpm audit --audit-level=high
      - run: pnpm typecheck
      - run: pnpm test:ci
