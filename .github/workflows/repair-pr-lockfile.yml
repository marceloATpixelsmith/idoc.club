name: Repair PR lockfile
on:
  workflow_dispatch:
  push:
    branches:
      - codex/complete-seminar-registration-and-payment-implementation
    paths:
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/repair-pr-lockfile.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/complete-seminar-registration-and-payment-implementation
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile
      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "Regenerate pnpm lockfile"
          git push origin HEAD:codex/complete-seminar-registration-and-payment-implementation
