name: Fix auth evidence summary counts

on:
  push:
    branches:
      - fix/auth-evidence-summary-counts

permissions:
  contents: write

jobs:
  fix-summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/auth-evidence-summary-counts
      - name: Correct docs/22 summary counts
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/22-canonical-auth-evidence-matrix.md')
          text = path.read_text()
          old_verified = '| verified | 105 | 67.7% |'
          old_unverified = '| implemented-but-unverified | 28 | 18.1% |'
          assert text.count(old_verified) == 1, 'expected exactly one stale verified summary row'
          assert text.count(old_unverified) == 1, 'expected exactly one stale unverified summary row'
          text = text.replace(old_verified, '| verified | 110 | 71.0% |')
          text = text.replace(old_unverified, '| implemented-but-unverified | 23 | 14.8% |')
          path.write_text(text)
          PY
      - name: Commit correction and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-auth-evidence-summary.yml
          git add docs/22-canonical-auth-evidence-matrix.md
          git commit -m "Correct auth evidence summary counts"
          git push origin HEAD:fix/auth-evidence-summary-counts
