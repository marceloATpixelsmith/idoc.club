name: Authentication security verification
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: idoc_test_security
          POSTGRES_PASSWORD: synthetic_test_password
          POSTGRES_USER: idoc_security_runner
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U idoc_security_runner -d idoc_test_security"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://idoc_security_runner:synthetic_test_password@127.0.0.1:5432/idoc_test_security
      AUTH_SECRET: security-e2e-only-auth-secret-32-bytes
      RATE_LIMIT_HASH_KEY: security-e2e-rate-limit-key-32-bytes
      PGOPTIONS: -c client_min_messages=warning
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Two-tier dependency scan: fails the build on a critical advisory (none exist in the current
      # dependency tree, so this is a real, enforced gate today, not aspirational); high/moderate
      # advisories are reported but do not fail the build yet, since the tree currently carries
      # several pre-existing high findings (transitive, via drizzle-orm and Next.js's own bundled
      # sharp/postcss) that predate this gate and need their own upgrade path rather than blocking
      # unrelated PRs the day this scan was turned on. Dependabot (.github/dependabot.yml) opens
      # weekly PRs to close these over time; tighten this step to --audit-level=high once triaged.
      - run: pnpm audit --audit-level=critical
      - run: pnpm audit --audit-level=high || echo "::warning::pnpm audit found high/moderate advisories -- see job output above. Not yet build-blocking; see .github/workflows/auth-security-verification.yml for why."
      - run: pnpm typecheck
      # Unit-level auth/security tests (JWT/session-boundary tampering and exact idle/absolute
      # timeout math, Turnstile fail-closed behavior, password policy/hashing, rate-limit hashing,
      # runtime configuration fail-closed checks) run here too, so a green "security" check is a
      # complete auth/security gate on its own rather than depending on a separate workflow.
      - run: pnpm test:ci
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:security
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: auth-security-playwright-evidence
          path: |
            playwright-report/
            test-results/security-e2e/
          retention-days: 7
