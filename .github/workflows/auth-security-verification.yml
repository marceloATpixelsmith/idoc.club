name: Authentication security verification
on:
  pull_request:
    branches: [main]
    paths:
      - 'app/(login)/**'
      - 'app/api/auth/**'
      - 'app/(dashboard)/dashboard/security/**'
      - 'app/(dashboard)/admin/security/**'
      - 'components/security/**'
      - 'components/turnstile-widget.tsx'
      - 'lib/auth/**'
      - 'lib/security/**'
      - 'lib/membership/**'
      - 'lib/runtime/**'
      - 'lib/db/**'
      - 'middleware.ts'
      - 'next.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tests/security-e2e/**'
      - 'tests/*auth*'
      - 'tests/*security*'
      - 'app/(dashboard)/onboarding/**'
      - 'app/(dashboard)/account/**'
      - 'app/(dashboard)/admin/members/**'
      - 'app/(dashboard)/layout.tsx'
      - 'app/(dashboard)/dashboard/layout.tsx'
      - 'app/api/user/**'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: idoc_test_security
          POSTGRES_PASSWORD: synthetic_test_password
          POSTGRES_USER: idoc_security_runner
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U idoc_security_runner -d idoc_test_security"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://idoc_security_runner:synthetic_test_password@127.0.0.1:5432/idoc_test_security
      AUTH_SECRET: security-e2e-only-auth-secret-32-bytes
      RATE_LIMIT_HASH_KEY: security-e2e-rate-limit-key-32-bytes
      PGOPTIONS: -c client_min_messages=warning
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: node scripts/validate-auth-docs.mjs
      - run: node scripts/validate-release-checklist.mjs
      - run: node scripts/check-whitespace.mjs
      - run: pnpm audit --audit-level=high
      - run: pnpm typecheck
      - run: pnpm test:ci
      # Remove the preconfigured Google Chrome APT source before Playwright refreshes
      # package indexes. Playwright's Chromium dependencies do not require that source,
      # and its stale mirror index can cause a false Hash Sum mismatch failure.
      - name: Install Playwright Chromium dependencies
        run: |
          while IFS= read -r -d "" source_file; do
            if sudo grep -qi "dl\\.google\\.com/linux/chrome" "$source_file"; then
              sudo mv "$source_file" "$source_file.disabled"
            fi
          done < <(sudo find /etc/apt -type f \( -name "*.list" -o -name "*.sources" \) -print0)
          sudo apt-get clean
          pnpm exec playwright install --with-deps chromium
      - run: pnpm test:security
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: auth-security-playwright-evidence
          path: |
            playwright-report/
            test-results/security-e2e/
          retention-days: 7
