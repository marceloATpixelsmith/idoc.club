name: Authentication security verification
on:
  pull_request:
    branches: [main, staging]
    paths:
      - 'app/(login)/**'
      - 'app/api/auth/**'
      - 'app/(dashboard)/dashboard/security/**'
      - 'app/(dashboard)/admin/security/**'
      - 'components/security/**'
      - 'components/turnstile-widget.tsx'
      - 'lib/auth/**'
      - 'lib/security/**'
      - 'lib/membership/**'
      - 'lib/runtime/**'
      - 'lib/db/**'
      - 'middleware.ts'
      - 'next.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tests/security-e2e/**'
      - 'tests/*auth*'
      - 'tests/*security*'
      - 'tests/auth/**'
      - 'docs/security/**'
      - 'scripts/validate-auth-test-matrix.mjs'
      - 'scripts/generate-auth-test-docs.mjs'
      - 'scripts/validate-auth-change-coverage.mjs'
      - 'scripts/write-auth-ci-results.mjs'
      - 'scripts/merge-auth-test-results.mjs'
      - 'app/(dashboard)/onboarding/**'
      - 'app/(dashboard)/account/**'
      - 'app/(dashboard)/admin/members/**'
      - 'app/(dashboard)/layout.tsx'
      - 'app/(dashboard)/dashboard/layout.tsx'
      - 'app/api/user/**'
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: auth-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: idoc_test_security
          POSTGRES_PASSWORD: synthetic_test_password
          POSTGRES_USER: idoc_security_runner
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U idoc_security_runner -d idoc_test_security"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://idoc_security_runner:synthetic_test_password@127.0.0.1:5432/idoc_test_security
      AUTH_SECRET: security-e2e-only-auth-secret-32-bytes
      RATE_LIMIT_HASH_KEY: security-e2e-rate-limit-key-32-bytes
      PGOPTIONS: -c client_min_messages=warning
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: node scripts/validate-auth-docs.mjs
      - name: Fetch PR base for sensitive-change comparison
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --no-tags --depth=1 origin "${BASE_REF}:refs/remotes/origin/${BASE_REF}"
      - run: pnpm validate:auth-test-catalog
      - name: Enforce auth test catalog coverage for sensitive changes
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # github.event.pull_request.body is a snapshot from whatever push triggered this run.
          # Editing the PR description afterward (e.g. to add the AUTH-TEST-CATALOG-NO-CHANGE
          # rationale this check itself asks for) doesn't retrigger the workflow, so a check that
          # trusted only that snapshot could never see a same-PR fix without another push. Fetch
          # the live description instead so an edited PR body is honored immediately.
          PR_BODY="$(gh pr view "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --json body --jq .body)"
          export PR_BODY
          node scripts/validate-auth-change-coverage.mjs
      # Remove the preconfigured Google Chrome APT source before Playwright refreshes
      # package indexes. Playwright's Chromium dependencies do not require that source,
      # and its stale mirror index can cause a false Hash Sum mismatch failure.
      - name: Install Playwright Chromium dependencies
        run: |
          while IFS= read -r -d "" source_file; do
            if sudo grep -qi "dl\\.google\\.com/linux/chrome" "$source_file"; then
              sudo mv "$source_file" "$source_file.disabled"
            fi
          done < <(sudo find /etc/apt -type f \( -name "*.list" -o -name "*.sources" \) -print0)
          sudo apt-get clean
          pnpm exec playwright install --with-deps chromium
      - run: pnpm test:security-e2e
      - name: Write synchronized auth CI results
        run: pnpm write:auth-ci-results
      - name: Upload auth CI results
        uses: actions/upload-artifact@v4
        with:
          name: auth-ci-results
          path: test-results/auth/auth-ci-results.json
          retention-days: 30
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: auth-security-playwright-evidence
          path: |
            playwright-report/
            test-results/security-e2e/
          retention-days: 7
