name: Port expanded admin changes

on:
  push:
    branches:
      - admin-news-blog-bulk-actions

permissions:
  contents: write

jobs:
  port:
    if: github.event.head_commit.message != 'Port completed feature diff'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: admin-news-blog-bulk-actions
      - name: Copy exact finished feature diff
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin admin-table-consistency
          paths=(
            "app/(dashboard)/admin/bulk-actions.ts"
            "app/(dashboard)/admin/layout.tsx"
            "app/(dashboard)/admin/members/members-table.tsx"
            "app/(dashboard)/admin/news/[id]/page.tsx"
            "app/(dashboard)/admin/news/[id]/preview/page.tsx"
            "app/(dashboard)/admin/news/actions.ts"
            "app/(dashboard)/admin/news/new/page.tsx"
            "app/(dashboard)/admin/pages/[id]/loading.tsx"
            "app/(dashboard)/admin/pages/[id]/page.tsx"
            "app/(dashboard)/admin/pages/[id]/preview/page.tsx"
            "app/(dashboard)/admin/pages/actions.ts"
            "app/(dashboard)/admin/pages/error.tsx"
            "app/(dashboard)/admin/pages/loading.tsx"
            "app/(dashboard)/admin/pages/new/page.tsx"
            "app/(dashboard)/admin/pages/page.tsx"
            "app/(dashboard)/admin/seminars/registrations/registrations-table.tsx"
            "app/(dashboard)/admin/support/support-inbox-table.tsx"
            "app/(marketing)/blog/[slug]/page.tsx"
            "app/(marketing)/blog/page.tsx"
            "app/(marketing)/news/[slug]/page.tsx"
            "app/(marketing)/news/page.tsx"
            "app/(marketing)/page.tsx"
            "app/globals.css"
            "components/admin-navigation.tsx"
            "components/admin/bulk-delete-selected.tsx"
            "components/admin/resource-data-table.tsx"
            "components/admin/resource-list-page.tsx"
            "components/content/content-form.tsx"
            "components/news/article-view.tsx"
            "components/news/news-form.tsx"
            "components/news/news-type-switch.tsx"
            "components/seminars/payment-method-icon.tsx"
            "docs/05-security-and-privacy-requirements.md"
            "docs/07-administrator-and-operations-runbook.md"
            "docs/08-product-roadmap-and-functional-requirements.md"
            "docs/security/AUTH_TEST_CATALOG.md"
            "docs/security/AUTH_TEST_COVERAGE.md"
            "lib/admin/table-preferences.ts"
            "lib/content/pages.ts"
            "lib/db/migrations/0064_news_article_type.sql"
            "lib/db/migrations/meta/0064_snapshot.json"
            "lib/db/migrations/meta/_journal.json"
            "lib/db/schema.ts"
            "lib/news/articles.ts"
            "lib/news/thumbnail.ts"
            "tests/admin-news-blog-bulk-delete.test.ts"
            "tests/auth/auth-test-matrix.json"
            "tests/content-pages.integration.ts"
            "tests/content-pages.test.ts"
            "tests/migration-immutability.test.ts"
          )
          for path in "${paths[@]}"; do
            if git cat-file -e "origin/admin-table-consistency:${path}" 2>/dev/null; then
              git checkout origin/admin-table-consistency -- "$path"
            else
              rm -f -- "$path"
            fi
          done
          rm -f .github/workflows/port-expanded-admin-changes.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Port completed feature diff"
          git push origin HEAD:admin-news-blog-bulk-actions
